# What ai-gladiators-briefing receives when crossbar-v2 is instantiated.
#
# EXPLICIT ALLOWLIST. tools/instantiate.py copies ONLY the files named here, from
# this repository (the source of truth) into the briefing contestant corpus.
# Nothing outside this list is ever copied - in particular nothing from matches/,
# no reviews, and no operator notes, and NO secrets (TLS keys, node keys, client keys
# and flag values are generated at setup, never committed). src is a path in THIS repo;
# dest is a path in ai-gladiators-briefing. The destination mirrors this repo's layout.

# -- the competition definition -------------------------------------------------
[[file]]
src  = "competitions/crossbar-v2.md"
dest = "competitions/crossbar-v2.md"

# -- target: both router configurations + the link ------------------------------
[[file]]
src  = "targets/crossbar/two-node/nodeA/.crossbar/config.json"
dest = "targets/crossbar/two-node/nodeA/.crossbar/config.json"

[[file]]
src  = "targets/crossbar/two-node/nodeB/.crossbar/config.json"
dest = "targets/crossbar/two-node/nodeB/.crossbar/config.json"

[[file]]
src  = "targets/crossbar/two-node/README.md"
dest = "targets/crossbar/two-node/README.md"

[[file]]
src  = "targets/crossbar/two-node/.gitignore"
dest = "targets/crossbar/two-node/.gitignore"

[[file]]
src  = "targets/crossbar/two-node/web/index.html"
dest = "targets/crossbar/two-node/web/index.html"

# -- target: build-time correctness check ---------------------------------------
[[file]]
src  = "targets/crossbar/two-node/verify_target.py"
dest = "targets/crossbar/two-node/verify_target.py"

# -- target: workload client ----------------------------------------------------
[[file]]
src  = "targets/crossbar/two-node/client/pyproject.toml"
dest = "targets/crossbar/two-node/client/pyproject.toml"

[[file]]
src  = "targets/crossbar/two-node/client/uv.lock"
dest = "targets/crossbar/two-node/client/uv.lock"

[[file]]
src  = "targets/crossbar/two-node/client/workload.py"
dest = "targets/crossbar/two-node/client/workload.py"

# -- target: local smoke harness (how to stand the mesh up) ---------------------
[[file]]
src  = "targets/crossbar/two-node/smoke.sh"
dest = "targets/crossbar/two-node/smoke.sh"

[[file]]
src  = "targets/crossbar/two-node/smoke_inject.py"
dest = "targets/crossbar/two-node/smoke_inject.py"

[[file]]
src  = "targets/crossbar/two-node/smoke_rogue.py"
dest = "targets/crossbar/two-node/smoke_rogue.py"

# -- referee (how the match is scored) ------------------------------------------
[[file]]
src  = "targets/crossbar/two-node/referee/verify_flags.py"
dest = "targets/crossbar/two-node/referee/verify_flags.py"

[[file]]
src  = "targets/crossbar/two-node/referee/verify_events.py"
dest = "targets/crossbar/two-node/referee/verify_events.py"

[[file]]
src  = "targets/crossbar/two-node/referee/verify_calls.py"
dest = "targets/crossbar/two-node/referee/verify_calls.py"
